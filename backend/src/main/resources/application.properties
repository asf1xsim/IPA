spring.application.name=ipa
server.port=8080

# db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/ipa_db
spring.datasource.username=postgres
spring.datasource.password=123

# Liquibase and JPA
#spring.liquibase.changeLogFile=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring.jpa.defer-datasource-initialization=true
spring.liquibase.enabled=true
spring.liquibase.default-schema=public
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


#  OAUTH2 / KEYCLOAK
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8091/realms/ipa-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8091/realms/ipa-realm/protocol/openid-connect/certs
keycloak.client-id=backend-client

spring.cache.type=simple